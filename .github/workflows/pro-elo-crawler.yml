name: MZ Pro-ELO Crawler

on:
  schedule:
    # Yedek tetikleyici (asıl saat başı tetikleme cron-job.org üzerinden workflow_dispatch ile yapılır)
    - cron: '37 */2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Çalışma modu (refresh = saatlik çift-model, discover = 100 ülke lig keşfi, snapshot = anlık çapa, seed = ilk kurulum)'
        required: false
        default: 'refresh'
        type: choice
        options:
          - refresh
          - discover
          - snapshot
          - seed
      top_limit:
        description: 'Her saat mutlaka yenilenecek en üst hibrit takım sayısı'
        required: false
        default: '400'
      rotate_limit:
        description: 'Aktif takımlardan her saat sırayla yenilenecek takım sayısı'
        required: false
        default: '9000'

concurrency:
  group: pro-elo-refresh
  cancel-in-progress: false

jobs:
  run-pro-elo:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: İlk kurulum (seed)
        if: ${{ github.event.inputs.mode == 'seed' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node src/seedFromStats.js

      - name: 100 Ülke Lig Keşfi (discover)
        if: ${{ github.event.inputs.mode == 'discover' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node src/discoverAllCountries.js

      - name: Tek seferlik Statsxente anlık kaydı (snapshot)
        if: ${{ github.event.inputs.mode == 'snapshot' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node src/snapshotAll.js

      - name: Çift Model Pro-ELO yenileme (Hibrit + Bağımsız)
        if: ${{ github.event.inputs.mode != 'seed' && github.event.inputs.mode != 'snapshot' && github.event.inputs.mode != 'discover' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TOP_LIMIT: ${{ github.event.inputs.top_limit || '400' }}
          IND_TOP_LIMIT: '200'
          ROTATE_LIMIT: ${{ github.event.inputs.rotate_limit || '9000' }}
          CONCURRENCY: '12'
        run: node src/refresh.js
