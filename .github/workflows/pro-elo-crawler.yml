name: MZ Pro-ELO Crawler

on:
  schedule:
    # Yedek tetikleyici (asıl kesin saat başı tetikleme cron-job.org üzerinden workflow_dispatch ile yapılır)
    - cron: '37 */2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Çalışma modu (refresh = çift model yenileme, snapshot = tek seferlik anlık kayıt, seed = ilk kurulum)'
        required: false
        default: 'refresh'
        type: choice
        options:
          - refresh
          - snapshot
          - seed
      top_limit:
        description: 'Her koşuda mutlaka yenilenecek en üst hibrit takım sayısı'
        required: false
        default: '300'
      rotate_limit:
        description: 'Sırayla yenilenecek takım sayısı'
        required: false
        default: '750'

concurrency:
  group: pro-elo-refresh
  cancel-in-progress: false

jobs:
  run-pro-elo:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: İlk kurulum (seed)
        if: ${{ github.event.inputs.mode == 'seed' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node src/seedFromStats.js

      - name: Tek seferlik Statsxente anlık kaydı (snapshot)
        if: ${{ github.event.inputs.mode == 'snapshot' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node src/snapshotAll.js

      - name: Çift Model Pro-ELO yenileme (Hibrit + Bağımsız)
        if: ${{ github.event.inputs.mode != 'seed' && github.event.inputs.mode != 'snapshot' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TOP_LIMIT: ${{ github.event.inputs.top_limit || '300' }}
          ROTATE_LIMIT: ${{ github.event.inputs.rotate_limit || '750' }}
        run: node src/refresh.js
