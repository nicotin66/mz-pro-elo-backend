name: Deploy Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Supabase CLI Kur
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Edge Function Canlıya Al (live-elo)
        run: supabase functions deploy live-elo --project-ref bggydqalllytcqwxsypj --no-verify-jwt --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
